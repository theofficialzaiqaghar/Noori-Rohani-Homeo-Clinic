<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#02243D" />
    <title>Page not found | Noori Roohani Homeo Clinic</title>
    <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --primary: #02243d;
        --gold: #d8b132;
        --cream: #fffef5;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family: Inter, system-ui, sans-serif;
        background: var(--cream);
        color: var(--primary);
        text-align: center;
      }
      h1 {
        font-size: clamp(1.75rem, 1.2rem + 2vw, 2.5rem);
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 1.5rem;
        max-width: 28rem;
        line-height: 1.6;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.75rem;
        padding-inline: 1.5rem;
        background: var(--gold);
        color: var(--primary);
        font-weight: 600;
        text-decoration: none;
        border-radius: 0.5rem;
      }
      a:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404 — Page not found</h1>
      <p>The page you requested is not here. Return to the clinic homepage for services and contact details.</p>
      <a href="/">Back to home</a>
    </main>
  </body>
</html>
